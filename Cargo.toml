[package]
name = "hypr-music-bg"
version = "0.1.0"
edition = "2024"
description = "Set the currently playing track's album art as your Wayland wallpaper"
license = "MIT"

[features]
# The settings GUI is opt-in so the daemon does not link a UI toolkit it never
# uses: the daemon is ~11 MB and ~10 MB resident, and egui would change both.
gui = ["dep:eframe", "dep:egui"]

[lib]
name = "hypr_music_bg"
path = "src/lib.rs"

[[bin]]
name = "hypr-music-bg"
path = "src/main.rs"

[[bin]]
name = "hypr-music-bg-settings"
path = "src/bin/settings.rs"
required-features = ["gui"]

[dependencies]
toml_edit = "0.25"
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.35", optional = true }
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "query",
    "form",
    "rustls",
    "rustls-native-certs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "signal", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
ksni = "0.3.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
